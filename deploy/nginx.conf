# nginx in front of the API (gunicorn on 127.0.0.1:8000, see backend/gunicorn.conf.py).
#
# These are whole server {} blocks, so they belong in nginx's http context: copy this file to
# /etc/nginx/conf.d/ (or sites-available/, linked from sites-enabled/), not inside another server.
# Set server_name and the two ssl_certificate lines first: until they're filled in, `nginx -t`
# fails, since a `listen 443 ssl` server needs a certificate.
#
# Set NUM_PROXIES in backend/.env to the number of proxies in front of Django, so the rate limits
# see the client's real IP: 1 when this nginx is the only one, 2 when a load balancer or Cloudflare
# sits in front of it. Too low and every sign-up shares the outer proxy's address, and one limit.
#
# Static files (the admin's CSS and JS) are served by WhiteNoise inside Django after
# `manage.py collectstatic`, so nothing static is configured here.

# Plain HTTP only redirects. Drop this block if a load balancer in front already does that.
server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.example.com;

    ssl_certificate     /etc/ssl/certs/api.example.com.pem;    # replace
    ssl_certificate_key /etc/ssl/private/api.example.com.key;  # replace

    # Voice debrief uploads: VOICE_DEBRIEF_MAX_BYTES (14 MB by default) plus multipart overhead.
    # Bigger bodies are refused here, before they reach Django.
    client_max_body_size 15m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # If TLS ends at a load balancer in front of nginx, $scheme here is http: pass the load
        # balancer's header on instead, with: proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Voice debriefs wait up to VOICE_DEBRIEF_TIMEOUT_SECONDS (50) for Gemini inside the
        # request. nginx's default of 60 seconds leaves too little room; keep this in step with
        # gunicorn's timeout.
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;

        # Leave request buffering on (the default). The voice endpoint refuses bodies without a
        # Content-Length, so "proxy_request_buffering off" would make every recording fail with 411.
    }
}
